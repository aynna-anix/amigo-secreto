<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amigo secreto</title>
</head>
<body>
    <header class="cabecalho"> 
        <div class="titulo-area">
            <h1> amigo secreto </h1>
        </div>
        <div class="IMAGEM area"> 
            <img src="https://blog.editoracontexto.com.br/wp-content/uploads/2019/12/amigo-secreto-809x285.png" 
            alt="imagem amigo secreto" >
              </div>
              <link rel="stylesheet" href="amigo.css">
    </header>
    <main class="conteudo"> 
        <section class="cadastro">  
            <h2> digite o nome do seus amigos</h2>

            <div class="campo-input">
                <input
                type="text"
                id="nomeAmigo"
                placeholder="digite um nome"
                >
                        <button onclick="adicionarAmigo()">
                            Adicionar
                        </button>
                          
            </div>
            <ul id="listaAmigos">
                <!-- nomes adicionados aparecen aqui-->
            </ul>
        </section>
        <section class="sorteio">
            <button onclick="sortearAmigo()">
                    Sortear Amigo
         </button>
            <p id="resultado">
                <!-- resultado do sorteio-->
            </p>
        </section>

    </main>
     <script src="script.js"></script>
</body>
</html>
